<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spancraft · Coming soon</title>
<meta name="description" content="Spancraft makes 3D drawings, walkthrough films and interactive models for architecture and real estate. Coming soon.">
<meta name="theme-color" content="#0E1422">
<meta property="og:title" content="Spancraft">
<meta property="og:description" content="3D drawings, walkthrough films and interactive models. Coming soon.">
<meta property="og:url" content="https://spancraft.in/">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/outfit.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face {
    font-family: "Outfit";
    src: url("assets/outfit.ttf") format("truetype");
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --night: #0E1422;
    --paper: #F5F2EA;
    --terracotta: #E88A63;
    --mark: clamp(2.25rem, 10vw, 3.25rem); /* width of the arch's front face */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--paper);
    font-family: "Outfit", system-ui, sans-serif;
    font-weight: 300;
    overflow: hidden;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .veil {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 24rem 20rem at 50% 58%, rgba(14,20,34,.9) 0%, rgba(14,20,34,.55) 45%, rgba(14,20,34,0) 100%);
  }
  /* The mark's front face is centred on the page, at the vault's vanishing point. */
  .mark {
    position: fixed; left: 50%; top: 50%; z-index: 1;
    width: calc(var(--mark) * 1.17); height: auto;
    transform: translate(-42.74%, -54.46%);
  }
  .words {
    position: fixed; left: 0; right: 0; z-index: 1;
    top: calc(50% + var(--mark) / 2 + 1.6rem);
    text-align: center; padding: 0 1rem;
  }
  h1 {
    font-weight: 300; font-size: clamp(.95rem, 3.6vw, 1.15rem);
    letter-spacing: .5em; padding-left: .5em; /* balance the tracking */
  }
  .soon {
    margin-top: .9rem;
    font-size: .68rem; letter-spacing: .42em; padding-left: .42em;
    text-transform: uppercase; color: var(--terracotta);
  }
  footer {
    position: fixed; z-index: 1; left: 0; right: 0; bottom: 1.4rem;
    text-align: center; font-size: .8rem; letter-spacing: .12em;
    color: rgba(245,242,234,.45);
  }
  footer a { color: inherit; text-decoration: none; transition: color .3s; }
  footer a:hover, footer a:focus-visible { color: var(--terracotta); }
  .mark, .words > * { opacity: 0; animation: rise 1.4s cubic-bezier(.2,.7,.2,1) forwards; }
  h1 { animation-delay: .3s; }
  .soon { animation-delay: .55s; }
  @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .mark, .words > * { animation: none; opacity: 1; } }
</style>
</head>
<body>
<canvas id="vault" aria-hidden="true"></canvas>
<div class="veil"></div>
<svg class="mark" viewBox="0 -9.8 117 109.8" aria-hidden="true">
  <path fill-rule="evenodd" d="M0 100V50A50 50 0 0 1 25.03 6.68L42.03 -3.12A50 50 0 0 1 117 40.2V90.2L100 100ZM37 100V40.2A30 30 0 0 1 44.34 20.54A30 30 0 0 1 80 50V100Z" fill="#E88A63"/>
  <path fill-rule="evenodd" d="M20 100V50A30 30 0 0 1 80 50V100ZM37 100V40.2A30 30 0 0 1 44.34 20.54A30 30 0 0 1 80 50V100Z" fill="#0E1422" opacity="0.3"/>
  <path fill-rule="evenodd" d="M0 100V50A50 50 0 0 1 100 50V100ZM20 100V50A30 30 0 0 1 80 50V100Z" fill="#F5F2EA"/>
</svg>
<div class="words">
  <h1>SPANCRAFT</h1>
  <p class="soon">Coming soon</p>
</div>
<footer><a href="mailto:hello@spancraft.in">hello@spancraft.in</a></footer>
<script>
// An endless walk through a vault of line-drawn arches. The arches share the logo's
// proportions (legs as tall as the radius), so the logo sits at the vanishing point;
// arches fade in some way in front of it, leaving space around it, and come out towards the viewer.
(() => {
  const canvas = document.getElementById('vault');
  const mark = document.querySelector('.mark');
  const ctx = canvas.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const RADIUS = 2.4;    // metres; legs are as tall as the radius, like the logo
  const EYE = RADIUS;    // eye at the spring line, so the vanishing point is the arch's centre
  const SPACING = 2.6;   // metres between arches
  const NEAR = 0.5;
  const SPEED = 0.25;    // metres per second
  const ACCENT_EVERY = 5;
  const CLEAR = 3.4;     // arches first appear at this many times the logo's size, leaving space around it

  let w, h, f, cx, cy, logo, far;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    f = Math.min(w, h) * 0.85;
    cx = w / 2; cy = h / 2;
    // The depth at which an arch is exactly the size of the logo's front face.
    const face = mark.getBoundingClientRect().width * 100 / 117;
    logo = f * 2 * RADIUS / face;
    far = logo / CLEAR;
    if (still) draw(0);
  }

  const project = (x, y, z) => [cx + (x / z) * f, cy - ((y - EYE) / z) * f];

  // One arch outline plus its floor joint. An arch seen head-on projects to a true
  // circle, so it is drawn with arc() rather than short segments, which shimmer as they move.
  function archPath(z) {
    const s = f / z;
    const [lx, ly] = project(-RADIUS, 0, z);
    const [, sy] = project(0, RADIUS, z);
    const rx = cx + RADIUS * s;
    ctx.moveTo(lx, ly);
    ctx.lineTo(lx, sy);
    ctx.arc(cx, sy, RADIUS * s, Math.PI, 2 * Math.PI);
    ctx.lineTo(rx, ly);
    ctx.lineTo(lx, ly);
  }

  const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  function draw(t) {
    ctx.clearRect(0, 0, w, h);

    // Floor rails, from the viewer to where the arches begin.
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(245,242,234,0.08)';
    ctx.beginPath();
    for (const x of [-RADIUS, RADIUS]) {
      const [ax, ay] = project(x, 0, NEAR);
      const [bx, by] = project(x, 0, far);
      ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
    }
    ctx.stroke();

    const travelled = (t / 1000) * SPEED;
    const offset = travelled % SPACING;
    const first = Math.floor(travelled / SPACING);
    const count = Math.ceil((far - NEAR) / SPACING) + 1;
    // Far to near, so nearer arches draw on top.
    for (let i = count - 1; i >= 0; i--) {
      const z = NEAR + (i + 1) * SPACING - offset;
      if (z <= NEAR) continue;
      const fade = smooth(far, far * 0.7, z) * smooth(NEAR, NEAR + 2.2, z);
      if (fade <= 0.002) continue;
      const accent = (first + i) % ACCENT_EVERY === 0;
      // Never thinner than a pixel; distant arches get fainter instead.
      const thin = 2.4 / z;
      ctx.lineWidth = Math.max(1, Math.min(2, thin));
      const alpha = fade * Math.max(0.35, Math.min(1, thin));
      ctx.strokeStyle = accent
        ? `rgba(232,138,99,${0.75 * alpha})`
        : `rgba(245,242,234,${0.32 * alpha})`;
      ctx.beginPath();
      archPath(z);
      ctx.stroke();
    }
  }

  function frame(t) { draw(t); requestAnimationFrame(frame); }

  addEventListener('resize', resize);
  resize();
  if (!still) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
